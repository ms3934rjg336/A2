<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache</title>
    <style>
        body {
            font-family: Verdana, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 40px;
            border: 3px solid #999;
            border-style: outset;
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #003366;
            margin-bottom: 20px;
        }
        button {
            background: #D3D3D3;
            border: 2px outset #999;
            padding: 15px 30px;
            font-family: Verdana, Arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin: 10px;
        }
        button:hover {
            background: #E0E0E0;
        }
        button:active {
            border-style: inset;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            background: #E8F5E9;
            border: 2px solid #4CAF50;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clear All Proposals Cache</h1>
        <p>This will delete all community proposals from your browser's storage.</p>
        <button onclick="clearCache()">Clear All Proposals</button>
        <button onclick="window.location.href='index.html'">Go Back to Site</button>
        <div id="status"></div>
    </div>

    <script>
        function clearCache() {
            // Clear proposals
            localStorage.removeItem('communityProposals');

            // Show confirmation
            const status = document.getElementById('status');
            status.textContent = '✅ All proposals have been cleared! The cache is now empty.';
            status.style.display = 'block';

            console.log('localStorage cleared:');
            console.log('- communityProposals: removed');
        }
    </script>
</body>
</html>
